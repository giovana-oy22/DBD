{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de Restaurantes</title>
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Trabalho Banco de Dados</p>
      <h1>Painel de Restaurantes</h1>
    </div>
  </header>

  <main class="page">

    <!-- FORM -->
    <section class="panel form-panel">
      <div class="panel-head">
        <h2>Criar Pedido Rapido</h2>
      </div>

      <form method="post" action="{% url 'criar_pedido' %}">
        {% csrf_token %}

        <label>Cliente</label>
        <select id="cliente_id" name="cliente_id" required>
          <option disabled selected>Selecione</option>
          {% for cliente in clientes %}
            <option value="{{ cliente.id }}">{{ cliente.nome }}</option>
          {% endfor %}
        </select>

        <label>Produto</label>
        <select name="produto_id" required>
          {% for produto in produtos %}
            <option value="{{ produto.id }}">
              {{ produto.nome }} | {{ produto.restaurante.nome }}
            </option>
          {% endfor %}
        </select>

        <label>Quantidade</label>
        <input type="number" name="quantidade" value="1" min="1">

        <button type="submit">Criar</button>
      </form>
    </section>

    <section class="grid">

      <!-- RESTAURANTES -->
      <section class="panel">
        <h2>Restaurantes</h2>

        <input 
          type="text" 
          id="busca-restaurante" 
          placeholder="Buscar restaurante..."
        >

        <div id="restaurantes" class="cards"></div>
      </section>

      <!-- PRODUTOS -->
      <section class="panel">
        <h2>Produtos</h2>

        <input 
          type="text" 
          id="busca-produto" 
          placeholder="Buscar produto..."
        >

        <div id="produtos" class="cards"></div>
      </section>

      <!-- PEDIDOS -->
      <section class="panel">
        <h2>Pedidos</h2>
        <div id="pedidos" class="cards"></div>
      </section>

    </section>

  </main>

  <template id="card-template">
    <div class="card">
      <h3 class="card-title"></h3>
      <p class="card-subtitle"></p>
      <p class="card-meta"></p>
    </div>
  </template>

  <script src="{% static 'js/dashboard.js' %}"></script>
</body>
</html>
